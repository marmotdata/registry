# Secret stores available on Marmot Cloud. Listed here for discovery only:
# stores ship inside the Cloud server image rather than as OCI artifacts, so
# there is nothing to pull and no versions to track. Metadata mirrors each
# store's Meta() in marmot-cloud-distro/secret-stores/<id>.
#
# `pnpm build` regenerates static/secret-stores.json from this file.

schema_version: 1

secret_stores:
  - id: aws
    display_name: AWS Secrets Manager
    description: Reads secrets from AWS Secrets Manager by name or ARN, federated through an IAM role assumed with a Marmot-issued web identity
    icon: aws-secrets-manager
    status: beta
    federation: IAM role with web identity

  - id: azure
    display_name: Azure Key Vault
    description: Reads secrets from Azure Key Vault by vault URI and name, federated through a federated credential on an app registration
    icon: azure-key-vault
    status: beta
    federation: Entra federated credential

  - id: google
    display_name: Google Secret Manager
    description: Reads global or regional secrets from Google Secret Manager by project and secret id, federated through Workload Identity Federation
    icon: google-secret-manager
    status: beta
    federation: Workload Identity Federation

  - id: vault
    display_name: HashiCorp Vault
    description: Reads secrets from a Vault KV v2 engine by mount, path and key, federated through the JWT auth method
    icon: vault
    status: beta
    federation: JWT auth
