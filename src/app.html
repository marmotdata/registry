<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" type="image/x-icon" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Plugins that connect Marmot, the open-source data catalog, to the tools you already run." />
		<!-- theme-color cannot read CSS variables, so these repeat --mm-paper for Light and Peat. -->
		<meta name="theme-color" content="#fdfbfa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)" />
		<script>
			// Pre-paint: apply a saved Light or Peat choice before first render. With no choice the
			// tokens follow prefers-color-scheme. "theme" is the key the previous site used.
			(() => {
				try {
					const saved = localStorage.getItem('mm-theme') ?? localStorage.getItem('theme');
					if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
